name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: feeling-palette
  STACK_NAME: feeling-palette
  CUSTOM_DOMAIN: feeling-api-aws.sedoli.co.kr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::811821010182:role/github-actions-feeling-palette
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lambda image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          IMAGE_LATEST=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            -f Dockerfile.lambda \
            -t "$IMAGE" \
            -t "$IMAGE_LATEST" \
            --push \
            .
          echo "IMAGE_URI=$IMAGE" >> "$GITHUB_ENV"

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Fetch Gemini API key from SSM
        run: |
          KEY=$(aws ssm get-parameter \
            --name /feeling-palette/gemini-api-key \
            --with-decryption \
            --region ${{ env.AWS_REGION }} \
            --query 'Parameter.Value' \
            --output text)
          echo "::add-mask::$KEY"
          echo "GEMINI_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: SAM deploy
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides ImageUri=$IMAGE_URI GeminiApiKey=$GEMINI_API_KEY \
            --image-repository ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            sleep 5
            response=$(curl -sS -X POST "https://${{ env.CUSTOM_DOMAIN }}/api/diary/analyze" \
              -H 'Content-Type: application/json' \
              -d '{"content":"배포 확인"}' || true)
            echo "attempt $i: $response"
            echo "$response" | grep -q '"primary_emotion"' && echo "smoke test passed" && exit 0
          done
          echo "smoke test failed"
          exit 1
